{
  "_comment": "Production-profile CKPool config. The harness supplies a unique wallet.worker identity per connection. Per-share disk logging is disabled by omitting CKPool's -L switch; errors remain enabled at LOG_ERR through the container command.",
  "btcd": [
    {
      "url": "${RPC_HOST}:${RPC_PORT}",
      "auth": "${RPC_USER}",
      "pass": "${RPC_PASS}",
      "notify": true
    }
  ],
  "btcaddress": "${ADDRESS}",
  "btcsig": "${TAG}",
  "blockpoll": 100,
  "update_interval": 30,
  "serverurl": ["0.0.0.0:3333"],
  "mindiff": ${MIN_DIFFICULTY},
  "startdiff": ${DIFFICULTY},
  "maxdiff": ${MAX_DIFFICULTY},
  "zmqblock": "tcp://${RPC_HOST}:28332",
  "logdir": "/ckpool/logs"
}
