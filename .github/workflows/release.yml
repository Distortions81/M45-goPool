name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to publish, such as v0.3.4
        required: true
        type: string

permissions: {}

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  UMBREL_STORE_REPOSITORY: M45Core/M45-Umbrel-Community-App-Store

jobs:
  release:
    name: Publish source release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Releases require a semantic version tag such as v0.3.5 or v0.3.5-rc1." >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes

  image:
    name: Publish Umbrel image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: gopool-image-${{ github.ref }}-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Check out release build exclusions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release-tools
          persist-credentials: false
          sparse-checkout: .dockerignore
          sparse-checkout-cone-mode: false

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source
          persist-credentials: false

      - name: Apply safe release build exclusions
        run: cp -- release-tools/.dockerignore source/.dockerignore

      - name: Record image metadata
        id: image
        shell: bash
        working-directory: source
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}" >> "${GITHUB_OUTPUT}"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
          echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: source
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
          build-args: |
            BUILD_TIME=${{ steps.image.outputs.build_time }}
            BUILD_VERSION=${{ env.RELEASE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Ensure Umbrel can pull the image anonymously
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          package_name="${GITHUB_REPOSITORY#*/}"
          package_name="${package_name,,}"
          if ! gh api \
            --method PATCH \
            "orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${package_name}" \
            -f visibility=public >/dev/null; then
            echo "GitHub did not allow the workflow to make the GHCR package public automatically." >&2
          fi

          anonymous_config="${RUNNER_TEMP}/anonymous-docker"
          mkdir -p "${anonymous_config}"
          image_is_public=false
          for attempt in $(seq 1 10); do
            if docker --config "${anonymous_config}" buildx imagetools inspect \
              "${IMAGE_NAME}:${RELEASE_TAG}@${IMAGE_DIGEST}" >/dev/null 2>&1; then
              image_is_public=true
              break
            fi
            sleep 3
          done
          if [[ "${image_is_public}" != "true" ]]; then
            echo "Make ${IMAGE_NAME} public in GitHub package settings, then rerun this workflow." >&2
            exit 1
          fi

      - name: Verify community-store dispatch token
        env:
          UMBREL_STORE_TOKEN: ${{ secrets.UMBREL_STORE_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${UMBREL_STORE_TOKEN}" ]]; then
            echo "Add UMBREL_STORE_TOKEN with Contents write access to ${UMBREL_STORE_REPOSITORY}." >&2
            exit 1
          fi

      - name: Dispatch immutable image to Umbrel store
        env:
          GH_TOKEN: ${{ secrets.UMBREL_STORE_TOKEN }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          jq --null-input \
            --arg tag "${RELEASE_TAG}" \
            --arg image "${IMAGE_NAME}" \
            --arg digest "${IMAGE_DIGEST}" \
            '{event_type: "gopool-release", client_payload: {tag: $tag, image: $image, digest: $digest}}' \
            | gh api \
                --method POST \
                "repos/${UMBREL_STORE_REPOSITORY}/dispatches" \
                --input -
